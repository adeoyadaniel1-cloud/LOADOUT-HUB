<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loadout Hub - Stealth Mode</title>
  <style>
    body {
      background-color: #000000; /* Pure Black Background */
      color: #ffffff; /* Crisp White Text */
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      color: #ffffff;
    }
    .status-box {
      background-color: #0a0a0a; /* Almost black */
      padding: 20px;
      border-radius: 5px;
      border: 1px solid #333333; /* Dark grey border */
      margin: 20px 0;
      width: 80%;
      max-width: 400px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    button {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      transition: 0.2s ease-in-out;
    }
    button:active { 
      transform: scale(0.95); 
      background-color: #ffffff;
      color: #000000;
    }
    #log { 
      margin-top: 20px; 
      color: #666666; 
      font-size: 14px; 
    }
  </style>
</head>
<body>

  <h1>Loadout Hub</h1>
  
  <div class="status-box">
    <h3>Network: <span id="network-status" style="color: #00ff00;">Checking...</span></h3>
    <p>Screen Lock: <span id="wake-status" style="color: #ff3333;">OFF</span></p>
  </div>

  <button id="boostBtn">Activate Stealth Mode</button>
  <div id="log">Awaiting deployment...</div>

  <script>
    const boostBtn = document.getElementById('boostBtn');
    const log = document.getElementById('log');
    const wakeStatus = document.getElementById('wake-status');
    const networkStatus = document.getElementById('network-status');
    let wakeLock = null;

    // 1. Check Network Connection
    function updateNetwork() {
      if (navigator.onLine) {
        networkStatus.textContent = "STABLE";
        networkStatus.style.color = "#ffffff";
      } else {
        networkStatus.textContent = "OFFLINE (Connection Dropped!)";
        networkStatus.style.color = "#ff3333";
      }
    }
    window.addEventListener('online', updateNetwork);
    window.addEventListener('offline', updateNetwork);
    updateNetwork();

    boostBtn.addEventListener('click', async () => {
      try {
        // 2. Go Fullscreen
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }

        // 3. Keep Screen Awake
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeStatus.textContent = "ACTIVE";
          wakeStatus.style.color = "#ffffff";
        }

        log.innerHTML = "Tactical Fullscreen ENGAGED.<br>Wake Lock ENGAGED.<br>Ready for Blood Strike.";
        boostBtn.textContent = "System Active";
        boostBtn.style.backgroundColor = "#ffffff";
        boostBtn.style.color = "#000000";
        boostBtn.style.boxShadow = "0 0 20px rgba(255, 255, 255, 0.6)";
        
      } catch (err) {
        log.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
